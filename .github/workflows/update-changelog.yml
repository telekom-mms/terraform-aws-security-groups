
---
name: update-changelog

on:
  pull_request:
    types: [closed]

env:
  TEMPLATE_REPOSITORY: telekom-mms/terraform-template

jobs:
  call-update-changelog:
    if: github.repository != '$TEMPLATE_REPOSITORY'
    uses: telekom-mms/.github/.github/workflows/update-changelog.yml@9df95914c02101f9ccd8cc4bce9033c1ba1b6bb7 # main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
